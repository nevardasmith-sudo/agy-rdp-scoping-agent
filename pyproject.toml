[project]
name = "agy-rpd-scoping-agent"
version = "0.1.0"
description = "Repeatable, Portable, and Demoable (RPD) Transformation Engine ADK Agent for the Gemini Enterprise Agent Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "google-adk[gcp]>=1.0.0",
    "google-cloud-firestore>=2.16.0",
    "pandas>=2.0.0",
    "requests>=2.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
